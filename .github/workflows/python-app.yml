# Run lightweight checks without downloading private Kickstarter data.
# This repository already had a CI workflow; this file improves that workflow
# rather than creating a second, duplicate Actions job.
name: Python CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8

      - name: Check critical Python lint errors
        run: flake8 utils tests --extend-exclude=.venv --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests and available local-data integration tests
        # Integration tests explicitly skip absent private artifacts; other errors fail.
        run: python -m unittest discover -s tests -v
